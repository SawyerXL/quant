{% extends "base.html" %}
{% block title %}登录 — Quant Circle{% endblock %}
{% block content %}
<div style="max-width:400px;margin:80px auto;">
    <h1 style="text-align:center;margin-bottom:32px;">Quant Circle</h1>
    {% if error %}
    <div class="flash flash-error" style="margin-bottom:16px;text-align:center;">{{ error }}</div>
    {% endif %}
    <div class="card">
        <h3>登录</h3>
        <form method="POST" action="/api/auth/login" style="display:flex;flex-direction:column;gap:12px;">
            <input type="text" name="username" placeholder="用户名" value="{{ username or '' }}" required autocomplete="username">
            <input type="password" name="password" placeholder="密码" required autocomplete="current-password">
            <button type="submit">登录</button>
        </form>
    </div>
    <div class="card" style="margin-top:16px;">
        <h3>注册</h3>
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px;">
            ⚡ 第一位用户自动成为管理员，邀请码留空即可。后续用户需要管理员提供的邀请码。
        </div>
        <form method="POST" action="/api/auth/register" style="display:flex;flex-direction:column;gap:12px;">
            <input type="text" name="username" placeholder="用户名 (至少2字符)" value="{{ reg_username or '' }}" required minlength="2" autocomplete="username">
            <input type="password" name="password" placeholder="密码 (至少4字符)" required minlength="4" autocomplete="new-password">
            <input type="text" name="invite_code" placeholder="邀请码 (首位用户可不填)">
            <button type="submit" class="secondary">注册</button>
        </form>
    </div>
</div>
{% endblock %}
